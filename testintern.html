<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Internship Calculator - Career Creators</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #f9f9f9, #e0f7fa);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: start;
      min-height: 100vh;
      padding-top: 40px;
    }

    .container {
      background: white;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      padding: 30px;
      border-radius: 16px;
      max-width: 700px;
      width: 90%;
    }

    h2 {
      text-align: center;
      color: #00796b;
      margin-bottom: 10px;
    }

    p.description {
      text-align: center;
      margin-bottom: 30px;
      color: #555;
    }

    label {
      display: block;
      margin: 15px 0 5px;
      font-weight: 600;
      color: #333;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fafafa;
    }

    button {
      width: 100%;
      background: #00796b;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 25px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #004d40;
    }

    #result {
      margin-top: 30px;
      font-size: 18px;
      padding: 20px;
      border-radius: 10px;
      display: none;
      background-color: #e0f2f1;
      color: #004d40;
    }

    #result a {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      background: #00796b;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
    }

    @media (max-width: 600px) {
      h2 { font-size: 22px; }
    }
  </style>

  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F1PKH55BTQ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-F1PKH55BTQ');
</script>
</head>
<body>

  <div class="container">
    <h2>📊 Internship Readiness Calculator</h2>
    <p class="description">Find out how close you are to landing a paid internship!</p>

    <form id="quizForm">
      <label>1. What year of college are you in?</label>
      <select id="q1">
        <option value="0">1st Year</option>
        <option value="5">2nd Year</option>
        <option value="10">3rd Year</option>
        <option value="15">Final Year / Graduate</option>
      </select>

      <label>2. Have you done any internships before?</label>
      <select id="q2">
        <option value="0">No</option>
        <option value="10">1 Internship</option>
        <option value="15">2 or more</option>
      </select>

      <label>3. How strong is your resume?</label>
      <select id="q3">
        <option value="0">No resume</option>
        <option value="10">Basic resume</option>
        <option value="15">ATS-optimized, strong layout</option>
      </select>

      <label>4. How many projects have you done?</label>
      <select id="q4">
        <option value="0">None</option>
        <option value="10">1–2</option>
        <option value="15">3 or more</option>
      </select>

      <label>5. Do you have a LinkedIn profile?</label>
      <select id="q5">
        <option value="0">No</option>
        <option value="5">Yes, but not updated</option>
        <option value="15">Yes, updated and active</option>
      </select>

      <label>6. Do you actively apply on job/internship portals?</label>
      <select id="q6">
        <option value="0">No</option>
        <option value="10">Sometimes</option>
        <option value="15">Yes, consistently</option>
      </select>

      <label>7. Are you confident in interviews?</label>
      <select id="q7">
        <option value="0">Not at all</option>
        <option value="10">Somewhat</option>
        <option value="15">Very confident</option>
      </select>

      <label>8. Do you know how to write a cover letter?</label>
      <select id="q8">
        <option value="0">No</option>
        <option value="5">Tried once or twice</option>
        <option value="10">Yes, I write custom ones</option>
      </select>

      <label>9. Are you active in college clubs or events?</label>
      <select id="q9">
        <option value="0">Not involved</option>
        <option value="10">Somewhat active</option>
        <option value="15">Very active / leadership roles</option>
      </select>

      <label>10. How many hours per week can you dedicate to an internship?</label>
      <select id="q10">
        <option value="5">Less than 5</option>
        <option value="10">5–10</option>
        <option value="15">10 or more</option>
      </select>

      <button type="button" onclick="calculateScore()">Calculate My Score</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    function calculateScore() {
      let score = 0;
      for (let i = 1; i <= 10; i++) {
        score += parseInt(document.getElementById("q" + i).value);
      }

      let resultText = "";
      if (score >= 120) {
        resultText = `🎉 You scored ${score}/150. You’re highly ready for a paid internship!<br><a href='https://careercreators.online/intern-ninja' target='_blank'>Apply Now with Intern Ninja →</a>`;
      } else if (score >= 80) {
        resultText = `⚠️ You scored ${score}/150. You have a good base, but there's room to improve.<br><a href='https://careercreators.online/resume' target='_blank'>Improve Resume →</a> or <a href='https://careercreators.online/intern-ninja' target='_blank'>Try Intern Ninja →</a>`;
      } else {
        resultText = `🚨 You scored ${score}/150. You need support to land an internship.<br><a href='https://careercreators.online/book' target='_blank'>Book a Free Counseling Call →</a>`;
      }

      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = resultText;
      resultDiv.style.display = "block";
    }
  </script>

</body>
</html>
